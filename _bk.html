<!doctype html><html><head><meta charset="UTF-8"><title>bk</title><link rel="stylesheet" href="styles.css"></head><body>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
async function fakePhoto(i) {
  const c = document.createElement('canvas'); c.width = 800; c.height = 600;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,800,600);
  g.addColorStop(0, `hsl(${i*70} 70% 60%)`); g.addColorStop(1, `hsl(${i*70+50} 55% 30%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,800,600);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 160px Arial'; ctx.fillText(String(i+1), 40, 200);
  return new File([await (await fetch(c.toDataURL('image/png'))).blob()], `f${i}.png`, { type: 'image/png' });
}
async function run() {
  const out = [];

  // --- device A: build a project and take a backup
  await readFiles([await fakePhoto(0), await fakePhoto(1)], src => addItem(src, 'free'));
  await wait(600);
  project.title = 'Vacanza';
  project.items[0].shape = 'circle';
  project.items[1].look = 'bw';
  const backup = JSON.stringify(await withMediaInline(project), null, 2);
  out.push(`backup=${(backup.length/1024).toFixed(0)} KB, foto incorporate=${(backup.match(/data:image/g) || []).length}`);

  // --- device B: nothing known, empty store and cache
  project = newProject();
  mediaCache.forEach(url => URL.revokeObjectURL(url));
  mediaCache.clear();
  mediaBlobs.clear();
  try { localStorage.clear(); } catch {}
  render(); await wait(300);
  out.push('dispositivo pulito: items=' + project.items.length + ' media=' + mediaBlobs.size);

  // --- import the file exactly as the button does
  const file = new File([backup], 'vacanza.json', { type: 'application/json' });
  openBackup(file);
  for (let i = 0; i < 150 && project.items.length < 2; i++) await wait(40);
  await wait(600);
  const imgs = [...document.querySelectorAll('#strip .item img')];
  out.push('importato: items=' + project.items.length + ' titolo="' + project.title + '"');
  out.push('immagini disegnate=' + imgs.filter(i => i.src && i.naturalWidth > 0).length + '/' + imgs.length);
  out.push('stile conservato: forma=' + project.items[0].shape + ' effetto=' + project.items[1].look);
  out.push('rientrate nel magazzino=' + mediaBlobs.size + ' (src ora ' + (project.items[0].src.startsWith('data:') ? 'data URL' : 'id') + ')');

  // export from the imported project
  HTMLCanvasElement.prototype.toBlob = async function (cb) { cb(await (await fetch(this.toDataURL('image/png'))).blob()); };
  document.querySelector('#export-open').click();
  for (let i = 0; i < 150 && document.querySelectorAll('.export-item').length < project.slideCount; i++) await wait(50);
  out.push('export dopo import=' + document.querySelectorAll('.export-item').length + ' slide');

  document.title = 'READY ' + out.join(' | ');
}
fetch('index.html').then(r => r.text()).then(html => {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.body.innerHTML = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
  const s = document.createElement('script'); s.src = 'app.js';
  s.onload = () => run().catch(e => { document.title = 'FAIL ' + e.message; });
  document.body.append(s);
});
</script></body></html>
